<c-row>
  <c-col xs>
    <c-card class="mb-4">
      <c-card-header>{{ isEdicao ? 'Editar produto' : 'Novo produto' }}</c-card-header>
      <c-card-body>
        @if (erro) {
          <c-alert color="danger">{{ erro }}</c-alert>
        }

        @if (carregando) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        } @else {
          @if (isEdicao) {
            <div class="mb-4 d-flex align-items-center gap-3">
              @if (urlFoto; as foto) {
                <img [src]="foto" alt="" width="96" height="96" style="object-fit: cover; border-radius: 4px" />
              } @else {
                <div class="d-flex align-items-center justify-content-center text-body-secondary border rounded"
                     style="width: 96px; height: 96px">
                  Sem foto
                </div>
              }
              <div>
                <label cButton color="secondary" variant="outline" class="mb-0" style="cursor: pointer">
                  {{ enviandoFoto ? 'Enviando...' : (urlFoto ? 'Trocar foto' : 'Adicionar foto') }}
                  <input type="file" accept="image/jpeg,image/png,image/webp" hidden
                         [disabled]="enviandoFoto" (change)="selecionarFoto($event)" />
                </label>
                @if (urlFoto) {
                  <button cButton color="danger" variant="outline" class="ms-2" [disabled]="enviandoFoto" (click)="removerFoto()">
                    Remover
                  </button>
                }
              </div>
            </div>
          }

          <form cForm cRow class="gy-3" (ngSubmit)="salvar()" #produtoForm="ngForm">
            <c-col md="6">
              <label cLabel for="nome">Nome</label>
              <input cFormControl id="nome" name="nome" [(ngModel)]="form.nome" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="tipo">Tipo</label>
              <select cSelect id="tipo" name="tipo" [(ngModel)]="form.tipo" required>
                <option value="peca">Peça</option>
                <option value="instalacao">Instalação</option>
                <option value="assinatura">Assinatura</option>
              </select>
            </c-col>
            <c-col xs="12">
              <label cLabel for="descricao">Descrição</label>
              <textarea cFormControl id="descricao" name="descricao" rows="3" [(ngModel)]="form.descricao"></textarea>
            </c-col>
            <c-col md="6">
              <label cLabel for="precoVenda">Preço de venda (R$)</label>
              <input cFormControl type="number" step="0.01" min="0" id="precoVenda" name="precoVenda" [(ngModel)]="form.precoVenda" />
            </c-col>
            <c-col md="6">
              <label cLabel for="custoBase">Custo base (R$)</label>
              <input cFormControl type="number" step="0.01" min="0" id="custoBase" name="custoBase" [(ngModel)]="form.custoBase" />
            </c-col>
            <c-col xs="12">
              <c-form-check>
                <input cFormCheckInput type="checkbox" id="ativo" name="ativo" [(ngModel)]="form.ativo" />
                <label cFormCheckLabel for="ativo">Ativo</label>
              </c-form-check>
            </c-col>
            <c-col xs="12" class="d-flex gap-2">
              <button cButton color="primary" type="submit" [disabled]="salvando || produtoForm.invalid">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
              </button>
              <button cButton color="secondary" variant="outline" type="button" routerLink="/produtos">
                Cancelar
              </button>
              @if (isEdicao) {
                <button cButton color="danger" variant="outline" type="button" class="ms-auto" [disabled]="salvando" (click)="excluir()">
                  Excluir
                </button>
              }
            </c-col>
          </form>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
