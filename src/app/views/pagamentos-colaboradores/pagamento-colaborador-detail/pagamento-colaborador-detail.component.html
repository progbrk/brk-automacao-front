<c-row>
  <c-col xs>
    <c-card class="mb-4">
      <c-card-header>{{ isEdicao ? 'Editar pagamento' : 'Novo pagamento a colaborador' }}</c-card-header>
      <c-card-body>
        @if (erro) {
          <c-alert color="danger">{{ erro }}</c-alert>
        }

        @if (carregando) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        } @else {
          <form cForm cRow class="gy-3" (ngSubmit)="salvar()" #pagamentoForm="ngForm">
            <c-col md="6">
              <label cLabel for="colaboradorId">Colaborador</label>
              <select cSelect id="colaboradorId" name="colaboradorId" [(ngModel)]="form.colaboradorId" required>
                <option value="" disabled>Selecione um colaborador</option>
                @for (colaborador of colaboradores; track colaborador.id) {
                  <option [value]="colaborador.id">{{ colaborador.nome }}</option>
                }
              </select>
            </c-col>
            <c-col md="6">
              <label cLabel for="vendaSelecionada">Venda</label>
              <select cSelect id="vendaSelecionada" name="vendaSelecionada"
                      [(ngModel)]="vendaSelecionadaId" (ngModelChange)="onVendaSelecionada()">
                <option value="" disabled>Selecione uma venda</option>
                @for (venda of vendas; track venda.id) {
                  <option [value]="venda.id">{{ descricaoVenda(venda) }}</option>
                }
              </select>
            </c-col>
            <c-col xs="12">
              <label cLabel for="vendaServicoId">Serviço executado</label>
              <select cSelect id="vendaServicoId" name="vendaServicoId" [(ngModel)]="form.vendaServicoId" required
                      [disabled]="!vendaSelecionadaId">
                <option value="" disabled>{{ vendaSelecionadaId ? 'Selecione o serviço' : 'Selecione uma venda primeiro' }}</option>
                @for (item of servicosDaVenda; track item.id) {
                  <option [value]="item.id">
                    {{ nomeServico(item.servicoId) }} — qtd. {{ item.quantidade }} — R$ {{ (item.valorTotal ?? 0) | number: '1.2-2' }}
                  </option>
                }
              </select>
            </c-col>
            <c-col md="4">
              <label cLabel for="valor">Valor pago (R$)</label>
              <input cFormControl type="number" step="0.01" min="0.01" id="valor" name="valor" [(ngModel)]="form.valor" required />
            </c-col>
            <c-col md="4">
              <label cLabel for="status">Status</label>
              <select cSelect id="status" name="status" [(ngModel)]="form.status" required>
                <option value="pendente">Pendente</option>
                <option value="pago">Pago</option>
              </select>
            </c-col>
            <c-col md="4">
              <label cLabel for="dataPagamento">Data do pagamento</label>
              <input cFormControl type="date" id="dataPagamento" name="dataPagamento" [(ngModel)]="form.dataPagamento" />
            </c-col>
            <c-col xs="12" class="d-flex gap-2">
              <button cButton color="primary" type="submit" [disabled]="salvando || pagamentoForm.invalid">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
              </button>
              <button cButton color="secondary" variant="outline" type="button" routerLink="/pagamentos-colaboradores">
                Cancelar
              </button>
              @if (isEdicao) {
                <button cButton color="danger" variant="outline" type="button" class="ms-auto" [disabled]="salvando" (click)="excluir()">
                  Excluir
                </button>
              }
            </c-col>
          </form>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
