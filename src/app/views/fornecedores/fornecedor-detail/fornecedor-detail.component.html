<c-row>
  <c-col xs>
    <c-card class="mb-4">
      <c-card-header>{{ isEdicao ? 'Editar fornecedor' : 'Novo fornecedor' }}</c-card-header>
      <c-card-body>
        @if (erro) {
          <c-alert color="danger">{{ erro }}</c-alert>
        }

        @if (carregando) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        } @else {
          <form cForm cRow class="gy-3" (ngSubmit)="salvar()" #fornecedorForm="ngForm">
            <c-col xs="12">
              <label cLabel for="nome">Nome</label>
              <input cFormControl id="nome" name="nome" [(ngModel)]="form.nome" required />
            </c-col>
            <c-col md="4">
              <label cLabel for="contato">Contato</label>
              <input cFormControl id="contato" name="contato" placeholder="Nome de quem atende" [(ngModel)]="form.contato" />
            </c-col>
            <c-col md="4">
              <label cLabel for="telefone">Telefone</label>
              <input cFormControl id="telefone" name="telefone" [(ngModel)]="form.telefone" />
            </c-col>
            <c-col md="4">
              <label cLabel for="email">E-mail</label>
              <input cFormControl type="email" id="email" name="email" [(ngModel)]="form.email" />
            </c-col>
            <c-col xs="12" class="d-flex gap-2">
              <button cButton color="primary" type="submit" [disabled]="salvando || fornecedorForm.invalid">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
              </button>
              <button cButton color="secondary" variant="outline" type="button" routerLink="/fornecedores">
                Cancelar
              </button>
              @if (isEdicao) {
                <button cButton color="danger" variant="outline" type="button" class="ms-auto" [disabled]="salvando" (click)="excluir()">
                  Excluir
                </button>
              }
            </c-col>
          </form>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
