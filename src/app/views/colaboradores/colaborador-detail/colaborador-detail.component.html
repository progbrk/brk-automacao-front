<c-row>
  <c-col xs>
    <c-card class="mb-4">
      <c-card-header>{{ isEdicao ? 'Editar colaborador' : 'Novo colaborador' }}</c-card-header>
      <c-card-body>
        @if (erro) {
          <c-alert color="danger">{{ erro }}</c-alert>
        }

        @if (carregando) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        } @else {
          <form cForm cRow class="gy-3" (ngSubmit)="salvar()" #colaboradorForm="ngForm">
            <c-col md="6">
              <label cLabel for="nome">Nome</label>
              <input cFormControl id="nome" name="nome" [(ngModel)]="form.nome" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="cargo">Cargo</label>
              <input cFormControl id="cargo" name="cargo" placeholder="ex: Técnico de instalação, Bombeiro Hidráulico" [(ngModel)]="form.cargo" />
            </c-col>
            <c-col md="4">
              <label cLabel for="tipo">Tipo</label>
              <select cSelect id="tipo" name="tipo" [(ngModel)]="form.tipo" required>
                <option value="Interno">Interno (equipe própria)</option>
                <option value="Terceiro">Terceiro (autônomo/prestador)</option>
              </select>
            </c-col>
            <c-col md="4">
              <label cLabel for="cpfCnpj">CPF/CNPJ</label>
              <input cFormControl id="cpfCnpj" name="cpfCnpj" placeholder="opcional" [(ngModel)]="form.cpfCnpj" />
            </c-col>
            <c-col md="4">
              <label cLabel for="telefone">Telefone</label>
              <input cFormControl id="telefone" name="telefone" [(ngModel)]="form.telefone" />
            </c-col>
            <c-col md="6">
              <label cLabel for="email">E-mail</label>
              <input cFormControl type="email" id="email" name="email" [(ngModel)]="form.email" />
            </c-col>
            <c-col xs="12">
              <c-form-check>
                <input cFormCheckInput type="checkbox" id="ativo" name="ativo" [(ngModel)]="form.ativo" />
                <label cFormCheckLabel for="ativo">Ativo</label>
              </c-form-check>
            </c-col>
            <c-col xs="12" class="d-flex gap-2">
              <button cButton color="primary" type="submit" [disabled]="salvando || colaboradorForm.invalid">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
              </button>
              <button cButton color="secondary" variant="outline" type="button" routerLink="/colaboradores">
                Cancelar
              </button>
              @if (isEdicao) {
                <button cButton color="danger" variant="outline" type="button" class="ms-auto" [disabled]="salvando" (click)="excluir()">
                  Excluir
                </button>
              }
            </c-col>
          </form>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
