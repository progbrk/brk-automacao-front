<c-row>
  <c-col xs>
    <c-card class="mb-4">
      <c-card-header>{{ isEdicao ? 'Editar cliente' : 'Novo cliente' }}</c-card-header>
      <c-card-body>
        @if (erro) {
          <c-alert color="danger">{{ erro }}</c-alert>
        }

        @if (carregando) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        } @else {
          <form cForm cRow class="gy-3" (ngSubmit)="salvar()" #clienteForm="ngForm">
            <c-col md="6">
              <label cLabel for="nome">Nome</label>
              <input cFormControl id="nome" name="nome" [(ngModel)]="form.nome" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="cpfCnpj">CPF/CNPJ</label>
              <input cFormControl id="cpfCnpj" name="cpfCnpj" [(ngModel)]="form.cpfCnpj" />
            </c-col>
            <c-col md="6">
              <label cLabel for="telefone">Telefone</label>
              <input cFormControl id="telefone" name="telefone" [(ngModel)]="form.telefone" />
            </c-col>
            <c-col md="6">
              <label cLabel for="email">Email</label>
              <input cFormControl id="email" name="email" type="email" [(ngModel)]="form.email" />
            </c-col>
            <c-col xs="12">
              <label cLabel for="endereco">Endereço</label>
              <input cFormControl id="endereco" name="endereco" [(ngModel)]="form.endereco" />
            </c-col>
            <c-col md="4">
              <label cLabel for="cidade">Cidade</label>
              <input cFormControl id="cidade" name="cidade" [(ngModel)]="form.cidade" />
            </c-col>
            <c-col md="4">
              <label cLabel for="estado">Estado</label>
              <input cFormControl id="estado" name="estado" [(ngModel)]="form.estado" />
            </c-col>
            <c-col md="4">
              <label cLabel for="cep">CEP</label>
              <input cFormControl id="cep" name="cep" [(ngModel)]="form.cep" />
            </c-col>
            <c-col xs="12">
              <label cLabel for="observacoes">Observações</label>
              <textarea cFormControl id="observacoes" name="observacoes" rows="3" [(ngModel)]="form.observacoes"></textarea>
            </c-col>
            <c-col xs="12" class="d-flex gap-2">
              <button cButton color="primary" type="submit" [disabled]="salvando || clienteForm.invalid">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
              </button>
              <button cButton color="secondary" variant="outline" type="button" routerLink="/clientes">
                Cancelar
              </button>
              @if (isEdicao) {
                <button cButton color="danger" variant="outline" type="button" class="ms-auto" [disabled]="salvando" (click)="excluir()">
                  Excluir
                </button>
              }
            </c-col>
          </form>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
