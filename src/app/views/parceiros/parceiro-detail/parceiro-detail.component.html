<c-row>
  <c-col xs>
    <c-card class="mb-4">
      <c-card-header>{{ isEdicao ? 'Editar parceiro' : 'Novo parceiro' }}</c-card-header>
      <c-card-body>
        @if (erro) {
          <c-alert color="danger">{{ erro }}</c-alert>
        }

        @if (carregando) {
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        } @else {
          <form cForm cRow class="gy-3" (ngSubmit)="salvar()" #parceiroForm="ngForm">
            <c-col md="6">
              <label cLabel for="nome">Nome</label>
              <input cFormControl id="nome" name="nome" [(ngModel)]="form.nome" required />
            </c-col>
            <c-col md="6">
              <label cLabel for="tipo">Tipo</label>
              <select cSelect id="tipo" name="tipo" [(ngModel)]="form.tipo" required>
                <option value="instalacao_hidraulica">Instalação hidráulica</option>
                <option value="loja_material">Loja de material de construção</option>
                <option value="arquitetura">Empresa de arquitetura</option>
                <option value="construtora">Construtora</option>
                <option value="outro">Outro</option>
              </select>
            </c-col>
            <c-col md="4">
              <label cLabel for="telefone">Telefone</label>
              <input cFormControl id="telefone" name="telefone" [(ngModel)]="form.telefone" />
            </c-col>
            <c-col md="4">
              <label cLabel for="email">E-mail</label>
              <input cFormControl type="email" id="email" name="email" [(ngModel)]="form.email" />
            </c-col>
            <c-col md="4">
              <label cLabel for="percentualComissao">Comissão (%)</label>
              <input cFormControl type="number" step="0.01" min="0" max="100" id="percentualComissao"
                     name="percentualComissao" [(ngModel)]="form.percentualComissao" required />
            </c-col>
            <c-col xs="12" class="d-flex gap-2">
              <button cButton color="primary" type="submit" [disabled]="salvando || parceiroForm.invalid">
                {{ salvando ? 'Salvando...' : 'Salvar' }}
              </button>
              <button cButton color="secondary" variant="outline" type="button" routerLink="/parceiros">
                Cancelar
              </button>
              @if (isEdicao) {
                <button cButton color="danger" variant="outline" type="button" class="ms-auto" [disabled]="salvando" (click)="excluir()">
                  Excluir
                </button>
              }
            </c-col>
          </form>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
